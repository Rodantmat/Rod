name: MLB Automatic Scraper
on:
  schedule:
    # Safety fallback only. AlphaDog Worker/Production Clock is the primary dispatcher.
    # These times intentionally avoid the exact Worker dispatch minute and every run writes
    # mlb_stats_refresh_audit + optional Worker callback status using github.run_id.
    - cron: '7 12,15,18,21,0,6 * * *'
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'AlphaDog orchestrator dispatch/request id'
        required: false
        type: string

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tools
        run: pip install curl_cffi requests
      - name: Start Scraping
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GITHUB_DISPATCH_ID: ${{ github.event.inputs.dispatch_id }}
          ALPHADOG_DISPATCH_ID: ${{ github.event.inputs.dispatch_id }}
          DISPATCH_ID: ${{ github.event.inputs.dispatch_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALPHADOG_WORKER_URL: ${{ secrets.ALPHADOG_WORKER_URL }}
          ALPHADOG_WORKER_STATUS_URL: ${{ secrets.ALPHADOG_WORKER_STATUS_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python main.py
